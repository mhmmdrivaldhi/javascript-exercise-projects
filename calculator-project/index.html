<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Display screen -->
         <div class="calculator-screen">
             <input type="text" id="calculatorDisplay" class="calculator-display" value="0" disabled>
         </div>

         <div class="calculator-keys">
             <!-- Calculator Button -->
              <button class="operator" value="%">%</button>
              <button class="operator" value="√">√</button>
              <button class="operator" value="/">&divide;</button>
              <button class="operator" value="*">&times;</button>
              
              <!-- Calculator Numbers -->
              <button value="7" class="number">7</button>
              <button value="7" class="number">8</button>
              <button value="7" class="number">9</button>
              <button class="operator" value="-">-</button>
     
              <!-- Calculator Numbers -->
              <button value="4" class="number">4</button>
              <button value="5" class="number">5</button>
              <button value="6" class="number">6</button>
              <button class="operator" value="+">+</button>
     
              <!-- Calculator Numbers -->
              <button value="1" class="number">1</button>
              <button value="2" class="number">2</button>
              <button value="3" class="number">3</button>
              <button value="." class="decimal">.</button>
              
              <!-- Equal Button Span 2 Colums -->
              <button value="0" class="all-clear">C</button>
              <button value="0" class="zero">0</button>
              <button class="equal-sign" value="=">=</button>
             </div>
        </div>


    <script src="script.js"></script>
</body>
</html>
